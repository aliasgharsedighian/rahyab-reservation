<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02c14c">
  <meta name="color-scheme" content="light dark">
  <title>اتصال برقرار نیست | فودنیکس</title>
  <link rel="icon" href="/icons/icon-192.png">
  <style>
    @font-face {font-family:IRANSans;src:url('/assets/fonts/iransanswebfanum.ttf') format('truetype');font-display:swap}
    :root {color-scheme:light;--bg:#f7faf8;--card:#fff;--text:#18181b;--muted:#626b65;--green:#02c14c;--soft:#edf9f1;--line:#d5eadd}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#090b0a;--card:#181c19;--text:#f4f6f4;--muted:#abb5ae;--green:#4ade80;--soft:#153322;--line:#2b4a36}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));background:radial-gradient(ellipse at top right,var(--soft),transparent 65%),var(--bg);color:var(--text);font-family:IRANSans,Tahoma,sans-serif}
    main{width:100%;max-width:440px;padding:32px 24px;border:1px solid var(--line);border-radius:24px;background:var(--card);text-align:center;box-shadow:0 24px 70px #02c14c12}
    .icon{width:80px;height:80px;display:grid;place-items:center;margin:auto;background:var(--soft);color:var(--green);border-radius:24px}
    .icon svg{width:40px;height:40px}
    .brand{margin:24px 0 8px;color:var(--green);font-size:12px;font-weight:bold}
    h1{font-size:24px;line-height:1.7;margin:0}
    p{font-size:14px;line-height:2;color:var(--muted)}
    .tip{text-align:right;padding:12px;border:1px solid #d99b2733;background:#d99b2712;border-radius:12px;color:var(--text)}
    button{width:100%;min-height:48px;margin-top:12px;border:0;border-radius:12px;background:var(--green);color:#062d15;font:700 15px IRANSans,Tahoma,sans-serif;cursor:pointer}
    button:focus-visible{outline:3px solid var(--text);outline-offset:4px}
    button:disabled{opacity:.65;cursor:wait}
    .foot{font-size:12px;margin-bottom:0}
    #connection{min-height:28px;font-size:12px;color:var(--green)}
    @media(max-width:360px){main{padding:24px 16px}h1{font-size:21px}}
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m2 2 20 20M8.5 16.5a5 5 0 0 1 7 0M12 20h.01M5 12a10 10 0 0 1 5-2.8M14 9.2a10 10 0 0 1 5 2.8M2 8.8A16 16 0 0 1 6 6.4M9.5 5.2A16 16 0 0 1 22 8.8"/></svg></div>
    <p class="brand">فودنیکس همراه شماست</p>
    <h1 id="title">ارتباط با فودنیکس برقرار نیست</h1>
    <p>اتصال اینترنت گوشی یا Wi-Fi را بررسی کنید و پس از برقراری ارتباط دوباره تلاش کنید.</p>
    <p class="tip">اگر VPN یا فیلترشکن روشن است، آن را خاموش کنید؛ اتصال به سرور فودنیکس با VPN ممکن نیست.</p>
    <button id="retry" type="button">تلاش دوباره</button>
    <p id="connection" role="status" aria-live="polite"></p>
    <p class="foot">رزرو غذا به اتصال اینترنت نیاز دارد.</p>
  </main>
  <script>
    const connection = document.getElementById('connection');
    const retry = document.getElementById('retry');
    function updateConnection() {
      connection.textContent = navigator.onLine ? 'اینترنت در دسترس است؛ برای بررسی اتصال به سرور تلاش کنید.' : 'دستگاه شما به اینترنت متصل نیست.';
    }
    window.addEventListener('online', updateConnection);
    window.addEventListener('offline', updateConnection);
    updateConnection();
    retry.addEventListener('click', () => {
      retry.disabled = true;
      retry.textContent = 'در حال اتصال مجدد...';
      if (location.pathname === '/offline.html') location.replace('/');
      else location.reload();
    });
  </script>
</body>
</html>
